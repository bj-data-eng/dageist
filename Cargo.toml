[package]
name = "dageist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-first visual DAG studio for dataframe pipelines."
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
exclude = ["Cargo.lock"]

[lib]
name = "dageist"
path = "src/lib.rs"

[dependencies]
dageist-engine = { path = "crates/dageist-engine", version = "=0.1.0" }
dageist-graph = { path = "crates/dageist-graph", version = "=0.1.0" }
dageist-workspace = { path = "crates/dageist-workspace", version = "=0.1.0" }

[lints]
workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/dageist"
rust-version = "1.99.1"

[workspace]
resolver = "3"
default-members = ["."]
members = [
    "crates/dageist-engine",
    "crates/dageist-fuzz",
    "crates/dageist-graph",
    "crates/dageist-pack",
    "crates/dageist-syntax",
    "crates/dageist-text",
    "crates/dageist-workspace",
    "crates/dageist-tauri",
]
# Vendored sources keep their own workspaces; Polars' crates inherit from Polars' root manifest.
exclude = ["vendor"]

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"

# A release build uses the settings Polars builds its Python wheels with (`dist-release` in
# vendor/polars/Cargo.toml): fat link-time optimisation, one codegen unit and no debug
# information. Its symbols are stripped. Panics still unwind: Polars' streaming executor catches
# the panics of its tasks, and the engine catches one Polars raises on a duration string.
[profile.release]
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# Polars' release optimises its SQL parser for size, as a cold path.
[profile.release.package.sqlparser]
opt-level = "s"

[profile.release.package.polars-sql]
opt-level = "s"

# The crate patches the Polars release in vendor/polars applies to the crates dageist builds,
# at the same revisions. Polars' `color-backtrace` patch serves only its Python binding.
# The API generator's release check keeps these equal to vendor/polars/Cargo.toml.
[patch.crates-io]
# Polars calls the prefetch API this fork adds (https://github.com/rust-lang/hashbrown/pull/727).
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }
# Polars' purge-before-grow hook with moving reallocation accounting.
tikv-jemalloc-sys = { git = "https://github.com/pola-rs/jemallocator", rev = "e947a0d1a786e221ac1c14ba1566b55151e61ec9" }
