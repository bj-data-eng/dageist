[package]
name = "dageist-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop host adapter for the dageist core."
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dageist"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dageist = { path = "../..", version = "=0.1.0" }
dageist-engine = { path = "../dageist-engine", version = "=0.1.0" }
dageist-graph = { path = "../dageist-graph", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = "=2.12.5"
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }

[build-dependencies]
tauri-build = "=2.7.4"

[dev-dependencies]
# The corpus of step documents builds the tables it runs them on, which the engine's public API
# does not hand out. The engine builds Polars with its features; this adds none.
polars = { path = "../../vendor/polars/crates/polars", default-features = false }
tauri = { version = "=2.12.5", features = ["test"] }
