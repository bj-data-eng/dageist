[package]
name = "dageist-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop host adapter for the dageist core."
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dageist"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dageist = { path = "../..", version = "=0.1.0" }
dageist-engine = { path = "../dageist-engine", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = "=2.12.5"

[build-dependencies]
tauri-build = "=2.7.4"

[dev-dependencies]
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["test"] }
