# English words for the catalogue. Every word the editor shows comes from a language
# file like this one, Polars' own names included. In English the shown name of an
# entry, a parameter and a choice word is exactly Polars' name; `changed` lists the
# names that are deliberately not, written as `Entry.id`, `Entry.id#parameter` or
# `Entry.id#parameter#word`.
changed = ["Expr.and_", "Expr.not_", "Expr.or_"]

