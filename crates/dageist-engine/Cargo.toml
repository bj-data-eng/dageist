[package]
name = "dageist-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dataframe engine for dageist: Polars plans, working windows and Arrow output."
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Polars is built from the Python Polars release in vendor/polars, with the features
# that release resolves for this crate; the API generator's release check keeps them equal.
polars = { path = "../../vendor/polars/crates/polars", default-features = false, features = [
    "abs",
    "approx_quantile",
    "approx_unique",
    "arg_where",
    "array_arithmetic",
    "array_count",
    "array_to_struct",
    "asof_join",
    "async",
    "avro",
    "aws",
    "azure",
    "binary_encoding",
    "bitwise",
    "business",
    "chunked_ids",
    "cloud",
    "concat_str",
    "cov",
    "cross_join",
    "cse",
    "csv",
    "cum_agg",
    "cumulative_eval",
    "cutqcut",
    "dataframe_arithmetic",
    "decompress",
    "diagonal_concat",
    "diff",
    "dot_diagram",
    "dot_product",
    "dtype-array",
    "dtype-categorical",
    "dtype-date",
    "dtype-datetime",
    "dtype-decimal",
    "dtype-duration",
    "dtype-extension",
    "dtype-f16",
    "dtype-full",
    "dtype-i128",
    "dtype-i16",
    "dtype-i8",
    "dtype-map",
    "dtype-struct",
    "dtype-time",
    "dtype-u128",
    "dtype-u16",
    "dtype-u8",
    "dynamic_group_by",
    "ewma",
    "ewma_by",
    "extract_groups",
    "extract_jsonpath",
    "find_many",
    "fmt",
    "fused",
    "gcp",
    "hist",
    "http",
    "iejoin",
    "index_of",
    "interpolate",
    "interpolate_by",
    "ipc",
    "ipc_streaming",
    "is_between",
    "is_close",
    "is_first_distinct",
    "is_in",
    "is_last_distinct",
    "is_unique",
    "json",
    "lazy",
    "list_arithmetic",
    "list_count",
    "list_drop_nulls",
    "list_eval",
    "list_filter",
    "list_gather",
    "list_sample",
    "list_to_struct",
    "log",
    "merge_sorted",
    "meta",
    "mode",
    "moment",
    "month_end",
    "month_start",
    "ndarray",
    "nightly",
    "object",
    "offset_by",
    "parquet",
    "partition_by",
    "pct_change",
    "peaks",
    "performant",
    "pivot",
    "polars-expr",
    "polars-io",
    "polars-lazy",
    "polars-ops",
    "polars-parquet",
    "polars-sql",
    "polars-time",
    "polars_cloud_client",
    "product",
    "propagate_nans",
    "random",
    "range",
    "rank",
    "regex",
    "reinterpret",
    "repeat_by",
    "replace",
    "rle",
    "rolling_window",
    "rolling_window_by",
    "round_series",
    "row_hash",
    "rows",
    "scan_lines",
    "search_sorted",
    "semi_anti_join",
    "serde",
    "serde-lazy",
    "sign",
    "simd",
    "sql",
    "streaming",
    "string_encoding",
    "string_normalize",
    "string_pad",
    "string_reverse",
    "string_to_integer",
    "strings",
    "temporal",
    "timezones",
    "to_dummies",
    "top_k",
    "trigonometry",
    "true_div",
    "unique_counts",
    "zip_with",
] }
# Features the release's Python binding turns on in polars-lazy directly, not through the
# polars crate: list set operations, Unity Catalog and expression plugins.
polars-lazy = { path = "../../vendor/polars/crates/polars-lazy", default-features = false, features = [
    "catalog",
    "ffi_plugin",
    "list_sets",
] }
# The release makes Polars' own allocator the global allocator.
polars-ooc = { path = "../../vendor/polars/crates/polars-ooc", default-features = false, features = ["fast_alloc"] }
# Reads the language files that give the catalogue its words, into a table; no serde derive.
# The version Cargo.lock already resolves for the host's build tooling, so it adds no package.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# Builds and compares JSON in the step document's tests. The version Cargo.lock already
# resolves for the host and the fuzz framework, so it adds no package; the engine's own
# JSON reader and writer do not use it.
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
# The property target in tests/allowed_fuzz generates cases and runs them through this
# framework's property runner. The fuzz framework depends on no production crate.
dageist-fuzz = { path = "../dageist-fuzz", features = ["property"] }
