[package]
name = "dageist-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Python-shaped notation of dageist's steps: its tokens, its tree with line and column spans, and its printing, without Polars."
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
# Runs the notation fuzz target in tests/notation_fuzz through its property runner. The fuzz
# framework depends on no production crate.
dageist-fuzz = { path = "../dageist-fuzz", features = ["property"] }
# Reads the fuzz target's descriptor. The version Cargo.lock already resolves for the engine.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }

