[package]
name = "dageist-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The graph of a dageist pipeline: its nodes, the references between them, its layout and its edits."
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Node ids are UUIDs; version 7 mints them in the order they are made. The version Cargo.lock
# already resolves.
uuid = { version = "=1.24.1", default-features = false, features = ["std", "v7"] }
