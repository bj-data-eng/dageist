[package]
name = "dageist-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git packs whose new objects are stored as deltas against bases the caller names, written through gix-pack."
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Writes the pack's entries and indexes the pack; gix creates no deltas itself, so this crate
# makes them. Its `generate` feature holds the entry writer, and `streaming-input` the reading of
# a pack back in to write its index.
gix-pack = { version = "=0.77.0", default-features = false, features = ["generate", "streaming-input"] }
# Names objects by their id.
gix-hash = { version = "=0.28.1", default-features = false, features = ["sha1"] }
# The kinds of object a pack holds, and an object's id from its bytes.
gix-object = { version = "=0.66.1", default-features = false }
# Discards the progress the indexing reports.
gix-utils = { version = "=0.5.3", default-features = false }
# Compresses each entry, as gix-pack does.
gix-zlib = { version = "=0.4.1", default-features = false }

[dev-dependencies]
# Runs the delta fuzz target in tests/delta_fuzz through its property runner. The fuzz framework
# depends on no production crate.
dageist-fuzz = { path = "../dageist-fuzz", features = ["property"] }
# Reads the fuzz target's descriptor. The version Cargo.lock already resolves for the engine.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
