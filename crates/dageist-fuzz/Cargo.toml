[package]
name = "dageist-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded fuzz campaigns and reproducible verification for Dageist."
readme = "README.md"
publish = false

[lints]
workspace = true

[features]
default = []
property = ["dep:proptest", "dep:proptest-state-machine"]
coverage = ["dep:arbitrary"]
execution = ["dep:ctrlc", "dep:clap"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "=0.10.9"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }
proptest-state-machine = { version = "=0.8.0", optional = true }
arbitrary = { version = "=1.5.0", features = ["derive"], optional = true }
rustix = { version = "=1.1.4", features = ["process", "fs"] }
ctrlc = { version = "=3.5.0", features = ["termination"], optional = true }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }

[dev-dependencies]
# The descriptor tests serialize descriptors back to TOML.
toml = { version = "=1.2.1", default-features = false, features = ["display", "parse", "serde", "std"] }

[[bin]]
name = "dageist-fuzz"
path = "src/bin/dageist-fuzz.rs"
required-features = ["execution"]

[[bin]]
name = "dageist-fuzz-process-worker"
path = "tests/fixtures/process_worker.rs"
required-features = ["execution"]
