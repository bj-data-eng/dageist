[package]
name = "dageist-fixture-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.dageist-fuzz]
descriptor = "fuzz.toml"

[features]
default = []
property = ["dageist-fuzz/property", "dep:proptest"]
coverage = ["dageist-fuzz/coverage", "dep:libfuzzer-sys"]

[dependencies]
dageist-fixture = { path = ".." }
dageist-fuzz = { path = "../../../.." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.2.1"
proptest = { version = "=1.11.0", default-features = false, features = ["std"], optional = true }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[[bin]]
name = "fixture-worker"
path = "src/bin/bytes.rs"
test = false
doc = false

[[bin]]
name = "fixture-structured-worker"
path = "src/bin/structured.rs"
test = false
doc = false

[[bin]]
name = "fixture-streaming-worker"
path = "src/bin/streaming.rs"
test = false
doc = false
