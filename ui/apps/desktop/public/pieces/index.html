<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pieces</title>
    <link rel="stylesheet" href="pieces.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>Pieces</h1>
      <p>
        One piece at a time, in several versions. Point at a piece for its tools, press it, tab to
        it, click to hold it open.
      </p>
    </header>

    <main>
      <h2 class="section">Button <span>a column</span></h2>
      <div id="versions-button" class="versions"></div>

      <h2 class="section">
        Function <span>the bracketed button in segments: the function, then its field</span>
      </h2>
      <div id="versions-function" class="versions"></div>
    </main>

    <!-- One card per version. pieces.js stamps it once for every entry in its list. -->
    <template id="card">
      <section class="card">
        <h3><span class="letter"></span><span class="name"></span></h3>
        <p class="note"></p>

        <div class="stage"><span data-piece="live"></span></div>

        <div class="states">
          <figure>
            <span data-piece="rest"></span>
            <figcaption>rest</figcaption>
          </figure>
          <figure>
            <span data-piece="hover"></span>
            <figcaption>hover</figcaption>
          </figure>
          <figure>
            <span data-piece="pressed"></span>
            <figcaption>pressed</figcaption>
          </figure>
          <figure>
            <span data-piece="open"></span>
            <figcaption>open</figcaption>
          </figure>
          <figure>
            <span data-piece="focus"></span>
            <figcaption>focus</figcaption>
          </figure>
          <figure>
            <span data-piece="off"></span>
            <figcaption>off</figcaption>
          </figure>
        </div>

        <!-- pieces.js keeps the row that suits the version and removes the other. -->
        <div class="row row-function">
          <span class="verb">Add column</span>
          <span class="alias">resolved_at</span>
          <span class="quiet">=</span>
          <span data-piece="live" data-name="timestamp"></span>
          <span class="quiet">›</span>
          <span data-piece="live" data-fn="shift"></span>
          <span class="quiet">›</span>
          <span data-piece="live" data-fn="over"></span>
          <span class="returns">returns <b>Datetime</b></span>
        </div>

        <div class="row row-button">
          <span class="verb">Add column</span>
          <span class="alias">step_index</span>
          <span class="quiet">=</span>
          <span data-piece="live"></span>
          <span class="quiet">›</span>
          <span class="method">cum_count</span>
          <span class="quiet">›</span>
          <span class="method">over</span>
          <span data-piece="live"></span>
          <span class="returns">returns <b>UInt32</b></span>
        </div>
      </section>
    </template>

    <!--
      The piece: the button's body between its two side panels. Pointing at it
      slides the panels out. pieces.js puts a copy wherever a card has a
      data-piece slot, and gives a function its second segment.
    -->
    <template id="piece">
      <span class="piece">
        <button type="button" class="side side-remove" aria-label="Remove">×</button>
        <span class="body"><button type="button" class="btn">dcn</button></span>
        <button type="button" class="side side-add" aria-label="Add">+</button>
      </span>
    </template>

    <script type="module" src="pieces.js"></script>
  </body>
</html>
